[project]
name = "bitflyer-bot"
version = "0.1.0"
description = "Rule-based automated trading system for bitFlyer with paper/live separation, risk management and kill switch"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    # urllib3 1.26 wraps a connection failure raised while a proxy is
    # configured into requests' ProxyError, INCLUDING a reset that happened
    # after the request body was written. The order-endpoint taxonomy in
    # bot/exchange/resilience.py no longer trusts ProxyError either way, but a
    # transport that cannot mislabel a post-send failure is worth pinning.
    "urllib3>=2",
    "pandas>=2.0",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "websockets>=12.0",
    # JPX daily-report parsing (scripts/fetch_jpx_daily.py, ON1 forward tracking)
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
