# CompositeStrategy configuration (src/bot/strategy/composite.py).
# Read by the strategy itself; config/config.yaml only selects the strategy.

# Core signal = xborder_momentum, mirroring config/config.yaml strategy.params.
# With every module below disabled the composite is signal-for-signal
# identical to xborder_momentum (verified by scripts/validate_composite.py).
core:
  k: 30                      # leader momentum window (bars)
  thr_pct: 0.8               # enter long above +thr, short below -thr (%)
  exit_pct: 0.05             # flatten when |leader momentum| fades below this (%)

# Modules are OFF and stay OFF until their gate is judged. Each one is either a
# PENDING hypothesis in docs/KNOWLEDGE.md §4 or a pre-registered CANDIDATE from
# the strategy tournament (scripts/research_tournament.py) — enabling one before
# its gate passes would be adopting an unvalidated rule.
#
# `gate` is the pre-registered unlock criterion. It is REQUIRED on every module
# entry and must match the text registered in code; omitting it or rewriting it
# here is refused at construction.
# `gate_evidence` is the report reference that satisfied the gate. It must be
# the BARE FILENAME of an existing docs/RESEARCH_REPORT_*.md (e.g.
# "RESEARCH_REPORT_2026-08-20b.md") — free text does not unlock anything, and
# a path (any "/", "\" or "..") is refused so nothing outside docs/ can be
# passed off as a report. Setting enabled: true with an empty gate_evidence, with invented
# evidence, or on a module whose veto rule is not implemented yet all raise at
# construction: a config edit alone can never switch a module on. Owner
# approval is still required: putting a strategy change into production is
# owner-gated.
modules:
  imbalance_filter:
    enabled: false
    gate: "board-data judgment >= 1-2 weeks recording, per KNOWLEDGE.md §4"
    gate_evidence: ""
    # would veto entries whose board imbalance opposes the signal

  funding_window:
    enabled: false
    gate: "13:00 UTC post-settlement drift re-test at 3x sample"
    gate_evidence: ""
    params:
      window_start_utc: "13:00"   # funding settles 05/13/21 UTC
      window_minutes: 30
    # would veto entries inside the post-settlement window

  oi_regime:
    enabled: false
    gate: "oi_snapshots.csv 30-day phase-C judgment"
    gate_evidence: ""
    # would veto entries by open-interest condition

  radar_window:
    enabled: false
    gate: "Champion paper >= 30 trades AND the inside-window subset beats the full set on net expectancy AND maxDD (tournament C2, scripts/research_tournament.py)"
    gate_evidence: ""
    params:
      window_start_utc: "12:30"   # bot.radar storm window (lift 2.23, n=234)
      window_end_utc: "15:00"
    # would veto entries whose signal time falls outside the storm window.
    # Tournament C2 beat the champion on expectancy AND maxDD, but on n=2
    # judgment trades and with the sign flipped on the 210d proxy — the
    # signature of an overfit split, not of an edge. Judgment is deferred to
    # the champion's own paper trades at n>=30.

  long_only:
    enabled: false
    gate: "Champion paper >= 30 trades AND the long-only subset beats the full set on net expectancy AND maxDD (tournament C3, scripts/research_tournament.py)"
    gate_evidence: ""
    # would veto entries that open or extend a short. Tournament C3 beat the
    # champion on expectancy AND maxDD, but on n=6 judgment trades and with the
    # sign flipped on the 210d proxy — same overfit signature as C2. Judgment
    # is deferred to the champion's own paper trades at n>=30.

# Risk overlay (src/bot/strategy/composite.py: size_factor) has no config:
# 95% drawdown trigger / 3-loss streak / x0.5 steps / 0.25 floor are fixed
# conventions, deliberately not tunable from YAML so they cannot become an
# unregistered parameter search. New exposure only; exits are never scaled.
# The overlay only ever SHRINKS an order the pre-trade risk checks already
# approved at full size, and its brake state is persisted in
# data/overlay_state.json so a restart cannot reset it (relative drawdown +
# loss streak; see docs/OPERATIONS.md §3 for when it may be deleted). That
# state is the overlay's own and is never fed back into the hard risk checks.
