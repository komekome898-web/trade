# Provenance registry for cost/market constants used across the project
# (QA_PLAN_2026-09.md §1-2 item 4).
#
# Rule: a bare-value constant is forbidden. Every entry below carries, at
# minimum, `value`, `unit`, `source_type`, `notes`.
#
# source_type:
#   primary_document -> official fee/spec page or press release. Requires
#                        `source_url` and `verified_on` (date checked, or
#                        the string "unverified (...)" with a reason).
#   measured          -> derived from this repo's own data/scripts. Requires
#                        `measured_by` (script or report path + data window)
#                        and `verified_on`.
#   assumed           -> not sourced from either of the above. May carry
#                        `deprecated: true` + `reason` once superseded.
#
# Loader: src/bot/constants.py (load_constants(), require_source()).
# Do not change values here to "fix" a strategy — this file only records
# provenance for values that already exist in config/*.yaml or in audit
# reports; changing a cost assumption is a research-protocol decision.

bitflyer_fx_btc_jpy:
  taker_fee_pct:
    value: 0.0
    unit: percent_of_notional
    source_type: primary_document
    source_url: "https://bitflyer.com/ja-jp/s/commission"
    verified_on: "unverified (egress blocked): bitflyer.com returns HTTP 403/Akamai 'Access Denied' to this session's proxy IP on every path (root, /ja-jp/commission, /ja-jp/s/commission); lightning.bitflyer.com (same operator, docs subdomain) is reachable but its /docs pages do not carry the fee schedule text. Fee value cross-checked instead via docs/NOTE_CRYPTO_CFD_2026-08-20.md (official API docs quote: 'The product_code for BTC-CFD/JPY used in each API will be FX_BTC_JPY'; 手数料0%・レバレッジ最大2倍は変更なし) and confirmed as the value the live order path actually consumes."
    measured_by: "config/products.yaml FX_BTC_JPY.taker_fee_pct=0.0 is read by src/bot/products.py:ProductSpec and used at src/bot/main.py order path; independently re-confirmed against the live 16-day tape in (削除済み文書) (fee term = 0 in all three cost-floor methods)."
    notes: >-
      0% taker/maker fee for bitFlyer Crypto CFD (successor to Lightning FX,
      discontinued 2024-03-28; API product_code FX_BTC_JPY unchanged). Do NOT
      use config.yaml `costs.taker_fee_pct: 0.15` for this product — that is
      a generic spot-tier default (see spot pairs in config/products.yaml)
      never applied to FX_BTC_JPY; using it here was an audited error
      ((削除済み文書), E2_cost_floor_maker_second.md).

  quoted_spread_median_bps:

    status: discarded_2026-09-08
    value: 1.9
    unit: bps
    source_type: measured
    measured_by: >-
      (削除済み文書) and
      E3_maker_arbiter.md; tape
      paper_logs/tape/{ticker,executions}_2026{0820..0904}.csv.gz,
      2026-08-20 06:13Z .. 2026-09-04 12:32Z (16 days,
      1,588,662-1,589,458 ticker/quote rows, cross-board board removed).
    verified_on: "2026-09-05"
    notes: >-
      Median quoted (ticker) spread ≈1.91bps over the full 16-day tape;
      1.95bps on the 2026-08-20..31 subset; 2.02bps from an independent
      1s board_top5 snapshot series; 1.78bps on 5s board_round snapshots.
      All cluster at ≈1.9bps. Supersedes the earlier single 4h-session
      figure of 2.22bps ((削除済み文書)) — that number
      is now judged "数値差異" (14-16% high), not wrong order of magnitude.

  realized_taker_one_way_bps:

    status: discarded_2026-09-08
    value: [1.0, 1.3]
    unit: bps
    source_type: measured
    measured_by: >-
      (削除済み文書), method (b)
      "realized: fill price vs immediately-preceding mid", n=750,122
      executions, same 16-day tape as quoted_spread_median_bps above.
    verified_on: "2026-09-05"
    notes: >-
      One-way realized cost: mean 1.291bps / median 1.036bps /
      volume-weighted 1.399bps (all executions); large orders
      (size>=0.05BTC, n=84,478) give 1.461bps one-way with no
      buy/sell asymmetry (1.280 vs 1.305bps). Independently, a
      separate 31-day executions file (2026-07-23..08-23) gives a
      1-minute BUY-VWAP minus SELL-VWAP of 0.99bps (a lower-bound
      cross-check, different window).

  realized_round_trip_bps:

    status: discarded_2026-09-08
    value: [2.0, 2.6]
    unit: bps
    source_type: measured
    measured_by: >-
      (削除済み文書), three
      independent methods on the same 16-day tape: (a) fee(0) +
      quoted-spread median = 1.91bps; (b) realized fill-vs-mid,
      volume-weighted = 2.58-2.80bps; (c) 0.01BTC board-walk,
      median 2.16bps / mean 2.29bps (top-5 depth sufficient 99.90%
      of the time). (削除済み文書)
      independently measures 1.77-1.91bps over the same window.
    verified_on: "2026-09-05"
    notes: >-
      Current best-estimate taker round-trip cost floor for
      FX_BTC_JPY. None of the three methods reproduces the deprecated
      5.8-7.9bps floor below — see taker_round_trip_floor_bps_OLD.

  taker_round_trip_floor_bps_OLD:

    status: discarded_2026-09-08
    value: [5.8, 7.9]
    unit: bps
    source_type: assumed
    deprecated: true
    reason: "unmeasured 2bps/leg slippage (02_provenance_costs.md)"
    verified_on: "2026-09-05 (deprecated by (削除済み文書) and E3_maker_arbiter.md)"
    notes: >-
      (削除済み文書) traces every one of
      5.8bps / 7.9bps / 3.96bps(side) / 3.2bps(side) and the "JFSA
      venue floor map" back to one un-derived assumption — 2bps of
      taker slippage per leg — first written with no measurement
      shown in (削除済み文書) (2026-08-20),
      then compounded with genuinely-measured spread figures across
      KNOWLEDGE.md and several PREREG/RESEARCH_REPORT files. DO NOT
      use for new judgment bars (research-protocol pre-registration);
      kept here only so existing verdicts that cited it can be traced
      (see 02_provenance_costs.md §4 "blast radius" table for the
      list of claims that flip once the floor is corrected to ≈2bps).

  funding_swap_daily_pct:
    value: 0.06
    unit: percent_of_notional_per_day
    source_type: measured
    measured_by: >-
      docs/NOTE_CRYPTO_CFD_2026-08-20.md, via
      /v1/getfundingrate + /v1/getfundingratehistory, 3-day sample
      at note-writing time.
    verified_on: "2026-08-20"
    notes: >-
      Funding rate settles 3x/day (UTC 05/13/21), cap +/-0.375%/
      settlement. Measured mean |rate| ~=0.021%/settlement
      ~=0.062%/day, sign both directions (not always a cost).
      config/products.yaml FX_BTC_JPY.swap_daily_pct=0.06 models this
      conservatively as an always-paid carry (slightly pessimistic).
      This is a holding/carry cost, not a per-trade fee; irrelevant
      for sub-day-hold round trips (see 02_provenance_costs.md §2).

