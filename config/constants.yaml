# すべて **失効** させた。値そのものは削除していないが、`status: discarded_2026-09-08`
# が付いた項目は **新しい研究の前提として引用してはならない**。コストは単位ごとに測り直す。
#
# 失効していないもの: 制度・仕様の事実(手数料率・呼値・売買単位・商品コード)、
# データの保持期間(data_retention.*)。これらは相場についての主張ではない。
