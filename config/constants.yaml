data_retention:
  bitflyer_executions_days:
    value: 31
    unit: days
    source_type: measured
    measured_by: >-
      (削除済み文書) row 1: live query
      of GET /v1/executions?product_code=FX_BTC_JPY with `before=` at
      id offsets; API itself returns
      {"status":-156,"error_message":"Execution history is limited to
      the most recent 31 days."} verbatim, confirmed live on the audit
      date.
    verified_on: "2026-09-04"
    notes: "Hard server-enforced limit, not inferred from missing data. This is why backtest_data/ snapshots exist (31-day window cannot be a long-term store, see CLAUDE.md §2)."

  okx_open_interest_1h_days:
    value: 30
    unit: days
    source_type: measured
    measured_by: >-
      (削除済み文書) row 2:
      GET /api/v5/rubik/stat/contracts/open-interest-volume,
      period=1H, binary-searched begin/end boundary; returns data
      through 30 days back, errors {"code":"50030","msg":"Illegal
      time range"} at 31 days and beyond.
    verified_on: "2026-09-04"
    notes: "Hard wall for the 1H granularity of this specific endpoint (open-interest-volume). Do not generalize to the L-S ratio endpoint below, which behaves differently."

  okx_open_interest_5m_days:
    value: [2, 3]
    unit: days
    source_type: measured
    measured_by: >-
      (削除済み文書) row 3 (noted in
      passing while testing the long-short-account-ratio-contract
      endpoint): the 5m granularity errors at only ~2-3 days back,
      much tighter than the 30d wall seen at 1H.
    verified_on: "2026-09-04"
    notes: "Confirms 'OKX retention' is granularity-dependent, not a single 30-day constant across all periods/endpoints."

  okx_long_short_ratio_days:
    value: [60, 90]
    unit: days
    source_type: measured
    measured_by: >-
      (削除済み文書) row 3:
      GET /api/v5/rubik/stat/contracts/long-short-account-ratio-contract
      (instId=BTC-USDT-SWAP, period=1H); does NOT hard-error at
      30/31/32/60 days (still code 0, i.e. success) — data goes empty
      (still code 0, not an error) somewhere between 60 and 90 days
      back. No after/cursor pagination param exists on this endpoint.
    verified_on: "2026-09-04"
    notes: >-
      Repo's prior "OKX ~=30日固定" note was accurate only for the
      open-interest-volume endpoint; the L-S ratio endpoint has a
      softer, further-out, empirically-bounded (not documented) limit.
      Re-check periodically — this boundary is not stated in OKX docs,
      only observed.

  jpx_daily_report_months:
    value: current_calendar_year
    unit: months
    source_type: measured
    measured_by: >-
      GET https://www.jpx.co.jp/automation/markets/statistics-derivatives/daily/json/daily_report_YYYYMM.json
      for 202101..202609 on 2026-09-08: 202601..202609 return HTTP 200,
      202510 and everything earlier returns 404 (21KB HTML error page).
      NOTE: HEAD requests to this host are unreliable (they returned 404 for
      months that GET serves at 200) -- always probe with GET.
    verified_on: "2026-09-08"
    notes: "The monthly index that lists each day's OSE report zip is kept only for the current calendar year, so the previous year's indexes (and the zips they link) roll off around Jan 1. scripts/fetch_jpx_daily.py parses only the Nikkei rows and used to discard the zip; raw zips are now kept under data/jpx_daily/raw/. Next rollover: 2027-01-01."

