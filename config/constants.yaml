  topix500_membership_note:
    value: "topix500_membership_list_not_registered"
    unit: text_flag
    source_type: assumed
    notes: >-
      TOPIX100 (and the wider TOPIX500 population that
      equity_tick_size_yen_by_price_band_topix500 above is keyed to) is
      reviewed and re-composed periodically by JPX/TSE — which tickers are
      members changes at each periodic review/rebalance, so "is ticker X a
      TOPIX100 constituent on date D" is a point-in-time fact, not a
      constant. This repo does NOT register a per-date TOPIX100 (or
      TOPIX500) membership list anywhere in config/constants.yaml or
      elsewhere — doing so would require an external, periodically
      refreshed, dated constituent feed that does not exist in this repo
      as of 2026-09-06 (docs/PHASE2/P2-07/PREREG.md flags the same gap:
      "個別株の呼値表は未登録 → 一次資料...で登録してから凍結"). Consequently
      any code or research unit (e.g. P2-07, or any individual-JPX-stock
      backtest) that chooses between
      equity_tick_size_yen_by_price_band_topix500 and
      equity_tick_size_yen_by_price_band_other for a given ticker MUST
      state, at the call site / pre-registration, (a) which column it
      applies to that ticker and on what basis, and (b) the point-in-time
      membership source used to justify that choice (a separately obtained,
      dated constituent list) — this constants file supplies only the
      yen-per-band tick sizes for each column, never membership.
      source_type=assumed because this entry documents a data-governance
      decision/caveat, not a value read off a primary document; there is no
      "unsourced constant" risk here since no numeric value from this entry
      is used in any cost/judgment computation.

