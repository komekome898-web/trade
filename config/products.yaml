# positions, SFD surcharge when |FX-spot|/spot >= 5% (bot must not trade near it).
FX_BTC_JPY: {market_type: FX,   min_size: 0.01,  taker_fee_pct: 0.0,  shortable: true,  leverage: 2, swap_daily_pct: 0.04}
