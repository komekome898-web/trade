# Trading configuration. NO secrets in this file.
# Product specs (min size, fees, leverage, shortability): config/products.yaml
product_code: FX_BTC_JPY     # Lightning FX: 0% taker fee, shortable, 2x leverage
candle_interval_sec: 60

# PAPER-mode virtual equity. FX_BTC_JPY min order is 0.01 BTC (~110k JPY
# notional), far above the real 6,000 JPY — this virtual stake exists ONLY to
# validate the strategy at realistic size. Live trading would require real
# funding and explicit owner approval.
paper_equity_jpy: 200000

# Refuse NEW FX entries when |FX-spot| divergence approaches the 5% SFD band.
sfd_guard_pct: 4.5

# Paper-trading validation target (see docs/RESEARCH_REPORT_2026-08-20*.md):
# follow Binance BTCUSDT moves on bitFlyer FX_BTC_JPY, long AND short.
# UNPROVEN — paper only. Params are set from the FX research (train/val only).
strategy:
  name: xborder_momentum     # ema_cross | rsi_reversion | breakout | xborder_momentum
  params:
    k: 5                     # leader momentum window (bars)
    thr_pct: 0.15            # enter long above +thr, short below -thr (%)
    exit_pct: 0.03           # flatten when |leader momentum| fades below this (%)

# Protective stop: flatten any position losing more than this % of entry price.
# Also defines the per-trade estimated loss used by the pre-trade risk checks.
stop_loss_pct: 0.5

# Leader market feed for xborder_momentum (public Binance data, read-only)
leader:
  exchange: binance
  symbol: BTCUSDT

# Poll intervals (seconds)
poll:
  ticker_sec: 5
  order_status_sec: 3

# Market data safety
market_data:
  max_staleness_sec: 60          # kill switch if no fresh data for this long
  max_price_jump_pct: 5.0        # single-tick move larger than this % = anomaly
  max_spread_pct: 1.0            # spread wider than this % = anomaly, no trading

# Fees / paper fill model (verify real account fee via check_api.py)
costs:
  taker_fee_pct: 0.15
  slippage_pct: 0.05

# LIVE MODE double-ack. Must be exactly "I_UNDERSTAND_REAL_MONEY" together with
# LIVE_MODE=true in the environment, otherwise the bot refuses to start in live mode.
live_mode_ack: ""

notifications:
  status_report_interval_sec: 3600
