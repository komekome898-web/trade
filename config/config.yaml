# Trading configuration. NO secrets in this file.
# Product specs (min size, fees, leverage, shortability): config/products.yaml
product_code: FX_BTC_JPY     # Lightning FX: 0% taker fee, shortable, 2x leverage
candle_interval_sec: 60

# PAPER-mode virtual equity. FX_BTC_JPY min order is 0.001 BTC (~11k JPY
# notional at ~11M JPY/BTC, see config/products.yaml), still above the real
# 6,000 JPY — this virtual stake exists ONLY to validate the strategy at
# realistic size. Live trading would require real funding and explicit owner
# approval.
paper_equity_jpy: 200000

# Basis-anomaly guard: refuse NEW CFD entries when |CFD-spot| divergence is
# abnormal. (The old SFD fee band no longer exists — Crypto CFD uses an 8h
# funding rate instead — but extreme divergence still signals a market you
# don't want to enter.)
sfd_guard_pct: 4.5

# Paper-trading validation target (see docs/RESEARCH_REPORT_2026-08-20*.md):
# follow Binance BTCUSDT moves on bitFlyer FX_BTC_JPY, long AND short.
# UNPROVEN — paper only. Params are set from the FX research (train/val only).
strategy:
  name: xborder_momentum     # ema_cross | rsi_reversion | breakout | xborder_momentum | composite
  # name: composite          # same core signal + config/composite.yaml modules
  #                          # (all disabled) + the risk overlay on new entries.
  #                          # The lead decides when to switch; owner-approved only.
  #                          # Switching restarts the 30-trade paper count from
  #                          # the switch (KNOWLEDGE.md §5, E2 precedent); the
  #                          # overlay brake applies from tick one after it.
  params:
    k: 30                    # leader momentum window (bars)
    thr_pct: 0.8             # enter long above +thr, short below -thr (%)
    exit_pct: 0.05           # flatten when |leader momentum| fades below this (%)

# Protective stop: flatten any position losing more than this % of entry price.
# Also defines the per-trade estimated loss used by the pre-trade risk checks.
stop_loss_pct: 0.5

# Leader market feed for xborder_momentum (public Binance data, read-only)
leader:
  exchange: binance
  symbol: BTCUSDT

# Poll intervals (seconds)
poll:
  ticker_sec: 5
  order_status_sec: 3

# Execution resilience (docs/OPERATIONS.md §3.5). Timeouts are SPLIT: the
# connect timeout stays tight (a connection that will not establish in 3s will
# not carry a useful order), while the read timeout is what widens when
# bitFlyer degrades — x2 at DEGRADED, x3 at CRITICAL.
# Retries apply to read-only endpoints and to order-endpoint failures that
# happened provably BEFORE the request was sent. An ambiguous order failure is
# never retried; it goes to bounded query-only reconciliation instead.
resilience:
  connect_timeout_sec: 3.0
  read_timeout_sec: 10.0
  retry_max_tries: 3
  retry_budget_sec: 10.0
  health_poll_sec: 30           # /v1/gethealth poll interval
  reconcile_budget_sec: 15.0    # LIVE only: budget to resolve STATE_UNKNOWN
  condition_window_sec: 900     # rolling error-rate window
  degraded_latency_ms: 1200
  critical_latency_ms: 3000
  # DEGRADED/CRITICAL でエントリーを絞るか。既定 false:
  # エントリー頻度を変えることは champion の戦略変更であり、事前登録
  # (.claude/skills/research-protocol) を経ずに稼働中のペーパー標本へ
  # 混ぜてはならない。gethealth=STOP の抑止はこのフラグとは無関係に常時有効。
  entry_gating: false

# Market data safety
market_data:
  max_staleness_sec: 60          # kill switch if no fresh data for this long
  max_price_jump_pct: 5.0        # single-tick move larger than this % = anomaly
  max_spread_pct: 1.0            # spread wider than this % = anomaly, no trading

# Fees / paper fill model (verify real account fee via check_api.py)
costs:
  taker_fee_pct: 0.15
  slippage_pct: 0.05

# LIVE MODE double-ack. Must be exactly "I_UNDERSTAND_REAL_MONEY" together with
# LIVE_MODE=true in the environment, otherwise the bot refuses to start in live mode.
live_mode_ack: ""

notifications:
  status_report_interval_sec: 3600
