# SIGNAL 探索段 4(2026-09-20)。対照で合わせる候補の変数。16 件 = 探索段 3 の 13 件 + m_pre_T + prev_bundle_gap_s + bundles_per_day。判定の量 = r_end(h) と continuation_rate(2 回走らせる)。定義の文は英語。
m_pre_T: "pre-liquidation move: signed price change over the T seconds before the bundle's first liquidation, in basis points (positive = in the liquidation direction)"
sweep_bp: "size of the sweep: signed change from the last trade before the first liquidation to the first trade after the last liquidation, in basis points"
prev_bundle_gap_s: "seconds from the previous bundle's last liquidation to this bundle's first liquidation (past quantity)"
next_bundle_gap_s: "seconds from this bundle's last liquidation to the next bundle's first liquidation (a future quantity; known only after the fact)"
bundles_per_day: "number of liquidation bundles on the same UTC day (a day-state proxy; partly future within the day)"
bundle_n_events_dedup: "number of liquidation events in the bundle (deduplicated)"
bundle_width_ms: "duration of the bundle in milliseconds"
bin_pct: "thinness of the price bin where the cascade occurred (share of the preceding W hours' volume in that bin)"
implied_leverage: "implied leverage of the liquidated positions"
dist_node_bp: "distance in basis points from the cascade price to the nearest high-volume price node of the preceding W hours"
baseline_lag_ms: "milliseconds between the baseline trade and the bundle's first liquidation"
bundle_total_notional: "total notional value liquidated in the bundle"
dist_vwap_bp: "distance in basis points from the cascade price to the volume-weighted average price of the preceding W hours"
doi_pre_1h: "change in open interest over the hour before the cascade (contracts)"
side: "whether the cascade liquidated longs (SELL) or shorts (BUY)"
time_of_day: "UTC hour of the cascade"
