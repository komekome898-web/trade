# SIGNAL 値段の続き + 全部逆張りの最適化(2026-09-21、L-342)。監査 2 回目の指摘 1 を受け、設計を見ていない下位モデル(sonnet)に
# オーナーの逐語 V-1〜V-6 と背景 1 段落だけを渡して独立に作らせた候補 15 本(逐語のまま。リードは手を入れていない)。
price_continuation_label_rate: "Fraction of Binance liquidation prints, out of the 2,000 sampled test-split chains, for which price moves 5 bp in the liquidation's direction within 60 seconds of the print (dimensionless ratio, 0 to 1)."
price_continuation_time_to_target_sec: "For prints where the 5 bp price-continuation label is true, the elapsed time in seconds from the liquidation print timestamp to the first tick that reaches the 5 bp move in the liquidation's direction."
jev_continuation_accuracy: "Fraction of prints, computed on the 5 bp price-continuation label (not the old same-side-next-liquidation label), where jev's stop/continue/unsure call at the moment of the print matches the realized outcome (dimensionless ratio, 0 to 1)."
jev_continuation_calibration_brier: "Brier score (mean squared error in probability space, 0 to 1, lower is better) between jev's continue-probability output at each print and the realized 0/1 outcome of the 5 bp price-continuation label."
all_reverse_optimized_pnl_per_chain: "Mean net PnL in basis points per chain achieved by the all-reverse-at-print-1-hold-to-chain-end policy after its own parameters (entry offset, exit/hold rule) are optimized on the train split, measured on the 2,000 test-split chains."
all_reverse_optimized_win_rate: "Fraction of the 2,000 test-split chains in which the parameter-optimized all-reverse policy closes with strictly positive net PnL in basis points (dimensionless ratio, 0 to 1)."
policy_vs_all_reverse_pnl_gap_bp: "Difference, in basis points per chain, between the mean net PnL of the jev-guided policy and the mean net PnL of the optimized all-reverse baseline, both measured on the same 2,000 test-split chains."
decision_latency_ms: "Wall-clock time in milliseconds from a liquidation print's timestamp to the policy's resolved actionable decision (enter/hold/close/flip), measured per print-level decision."
round_trip_cost_bp: "Total transaction cost in basis points (spread crossed + exchange fee + estimated slippage) incurred by one executed trade under the policy, measured per executed trade."
net_pnl_after_cost_per_decision_bp: "Net PnL in basis points per print-level decision after subtracting round_trip_cost_bp from the gross PnL of that decision, measured across all decisions in the 2,000 test-split chains."
pnl_dispersion_by_chain_length: "Standard deviation and interquartile range of net PnL in basis points per chain, computed separately for short chains and long chains (bucketed by number of prints in the chain), rather than pooled into a single mean."
accuracy_by_chain_position: "jev's continuation accuracy (fraction correct, 0 to 1), computed separately for the 1st print of a chain versus the 2nd-and-later prints of a chain, rather than pooled into one average."
pnl_by_liquidation_side: "Median and 10th/90th percentile net PnL in basis points per chain, computed separately for chains driven by long liquidations versus chains driven by short liquidations."
signal_pnl_uplift_if_gated: "Difference in mean net PnL in basis points per chain between (a) only acting on prints where jev outputs 'continue' and (b) acting on every print unconditionally, both measured on the 2,000 test-split chains."
jev_query_latency_ms: "Wall-clock time in milliseconds from the moment a liquidation print is detected to the moment jev's stop/continue/unsure response is received, measured per query, as the latency cost of the detect-then-ask-jev pipeline."
