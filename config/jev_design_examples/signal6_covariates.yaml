# SIGNAL 続く/止まるの単位(2026-09-20)。t₀ に手元にある材料(ts 以前の約定・清算・5 分値だけ)。定義の文は英語(日本語の行を設計に添える)。
same_side_count_60s_and_elapsed: "number of same-side liquidation prints in the 60 seconds before this print, and seconds since the first of them"
interval_ratio_last_two: "ratio of the interval between the last two same-side prints to the interval before that (shrinking intervals = accelerating cascade)"
notional_and_ratio_to_previous: "this print's notional in USD and its ratio to the previous same-side print's notional"
move_since_cascade_start_and_bounce: "signed price move since the first print of the current cascade, and the bounce after the previous print (price moving back against the liquidation direction)"
distance_to_liquidation_node: "signed distance in bp from the current price to the nearest reconstructed liquidation price cluster (dist_node_bp); grows as the cascade passes the cluster"
time_of_day_band: "UTC six-hour band of the print"
open_interest_mass_ahead: "reconstructed open interest (contracts) whose liquidation price lies within 5, 10 and 20 bp ahead in the liquidation direction"
taker_imbalance_5s: "taker buy minus taker sell quantity over the 5 seconds before the print divided by their sum"
oi_slope_and_funding: "change rate of open interest over the last 5-minute bars, taker long/short volume ratio, and the latest funding rate"
notional_over_60s_range: "this print's notional divided by the high-low range in bp of the 60 seconds before the print"
notional_over_max_recent_print: "this print's notional divided by the largest same-side print in the previous 60 seconds (missing if none)"
taker_imbalance_trend: "taker imbalance over the last 5 seconds minus taker imbalance over the last 30 seconds (fading pressure when negative)"
trade_count_60s: "number of aggregate trades in the 60 seconds before the print (market activity)"
burst_ratio_10s_over_60s: "signed price displacement over the last 10 seconds divided by the displacement over the last 60 seconds, liquidation direction positive"
print_sweep_ticks_and_side: "this print's own price impact in ticks and the liquidation side (SELL or BUY); kept as columns, not as strata"
