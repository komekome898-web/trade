# SIGNAL 値段の続き + 全部逆張りの最適化(2026-09-21、L-342)。候補の観測量。定義の文は英語(日本語の行を設計に添える)。
per_cascade_policy_pnl_value_label: "per-cascade profit in bp of a policy that judges at every liquidation print whether price will continue 5 bp in the liquidation direction within 60 s (stop / continue / unknown) and acts (enter fade, enter with, stay out; then hold, close or reverse at later prints; close at cascade end), as a distribution across cascades"
per_cascade_policy_pnl_net_of_cost: "the same per-cascade profit after subtracting the measured bitFlyer effective spread once per position opened or reversed"
optimized_fade_total_pnl_first_half: "total profit over the first half of a fade-every-cascade rule with pre-fixed knobs (entry position, entry condition on one material, exit rule, stop loss), maximized over a fixed grid"
optimized_fade_vs_policy_second_half: "side-by-side per-cascade profit on the same 2,000 second-half cascades of the optimized fade rule, the plain fade rule, the value-label policy and the liquidation-label policy"
value_label_calibration_bands: "0.02-wide probability bands from first-half out-of-fold calibration in which the observed share of price continuation is indistinguishable from the base rate, used as the unknown band"
effective_spread_after_liquidation: "distribution of bitFlyer effective spread (bp) on sample days, at all times and in the 1-5 s after a Binance liquidation"
daily_pnl_distribution: "distribution of daily sums of per-cascade profit for each policy (share of negative days, contribution of the top and bottom five days)"
perfect_judgment_value_label_reference: "per-cascade profit when the judgment at each print is the ex-post price-continuation label, computed along the cascade path, as a reference (not an upper bound)"
knob_contribution_one_at_a_time: "change in first-half total profit when each knob of the chosen fade rule is moved alone while the others are held"
label_agreement_value_vs_liquidation: "share of prints on which the price-continuation label and the next-liquidation label agree, by half and side"
per_print_fixed_horizon_move: "signed price move from each print to a fixed horizon (the earlier unit's quantity, kept only as a reference)"
# --- 計画外の候補(監査 1 回目の指摘 6 で足した。Q0〜Q6 に無い量) ---
jev_judgment_on_value_label: "per-cascade profit when Jev, not the logistic, judges price continuation at each print"
pnl_on_bitflyer_prices: "per-cascade profit recomputed on bitFlyer FX_BTC_JPY prices instead of Binance prices"
control_no_liquidation_same_momentum: "the same policy applied at moments with the same momentum and taker imbalance but no liquidation, as a control"
order_book_depth_at_print: "visible order book depth within 5 bp of the price at each print"
position_size_by_cascade_notional: "per-cascade profit when position size is scaled by the liquidated notional at entry"
daily_loss_cap_rule: "per-day profit when trading stops for the day after a fixed cumulative loss"
liquidation_label_policy_pnl_net_of_cost: "the earlier unit's liquidation-label policy profit recomputed net of cost (the comparison baseline)"
