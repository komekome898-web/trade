# Hard safety limits. The bot refuses any order violating one of these,
# and trips the kill switch where noted. Changing these in production
# requires explicit owner approval.
MAX_ORDER_SIZE_JPY: 3000        # max notional per order
MAX_POSITION_SIZE_JPY: 6000     # max total open position notional
MAX_DAILY_LOSS_JPY: 300         # kill switch when daily realized+unrealized loss reaches this
MAX_DRAWDOWN_PCT: 10.0          # kill switch at this % drawdown from equity peak
MAX_OPEN_ORDERS: 1
MAX_CONSECUTIVE_LOSSES: 4       # kill switch after this many losing trades in a row
MAX_API_ERRORS_IN_ROW: 5        # kill switch after this many consecutive API errors
